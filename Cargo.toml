[package]
name = "forktest"
version = "0.1.0"
edition = "2024"
description = "A fast, pytest-compatible test runner: warm zygotes, forked workers, affected-test selection."
license = "MIT"

[[bin]]
name = "forktest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
notify = "7"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ruff_python_ast = "=0.0.20"
ruff_python_parser = "=0.0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "2"
thin-vec = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
